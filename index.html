<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio - Nabilah Yusuf</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="#beranda" class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
                Nabilah Yusuf
            </a>
            <!-- Desktop Nav -->
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
                <a href="#beranda" class="hover:text-indigo-600 transition">Beranda</a>
                <a href="#tentang" class="hover:text-indigo-600 transition">Tentang</a>
                <a href="#cv" class="hover:text-indigo-600 transition">CV</a>
                <a href="#prestasi" class="hover:text-indigo-600 transition">Prestasi</a>
                <a href="#galeri" class="hover:text-indigo-600 transition">Galeri</a>
                <a href="#kontak" class="hover:text-indigo-600 transition">Kontak</a>
            </nav>
            <!-- Mobile Menu Button -->
            <button id="menu-btn" class="md:hidden text-slate-700 focus:outline-none text-xl">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <!-- Mobile Nav Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-slate-100 px-6 py-4 space-y-3 text-sm font-medium">
            <a href="#beranda" class="block hover:text-indigo-600">Beranda</a>
            <a href="#tentang" class="block hover:text-indigo-600">Tentang</a>
            <a href="#cv" class="block hover:text-indigo-600">CV</a>
            <a href="#prestasi" class="block hover:text-indigo-600">Prestasi</a>
            <a href="#galeri" class="block hover:text-indigo-600">Galeri</a>
            <a href="#kontak" class="block hover:text-indigo-600">Kontak</a>
        </div>
    </header>

    <!-- 1. Beranda Section -->
    <section id="beranda" class="py-20 md:py-28 overflow-hidden bg-gradient-to-b from-indigo-50/50 to-white">
        <div class="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center">
            <div class="space-y-6">
                <span class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-indigo-100 text-indigo-700
